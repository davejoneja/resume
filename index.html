<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="A minimal personal portfolio template.">
    <title>Dave Joneja</title>
    <link rel="icon" href="images/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header class="site-header">
        <a class="site-name" href="#" aria-label="Dave Joneja, home">DAVE JONEJA</a>
    </header>

    <button class="menu-toggle" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="site-menu">
        <span></span>
        <span></span>
        <span></span>
    </button>

    <aside class="menu-panel" id="site-menu" aria-hidden="true">
        <nav class="primary-nav" aria-label="Primary navigation">
            <a href="#">RESUME</a>
            <a href="#">PROJECTS</a>
            <a href="#">ABOUT ME</a>
        </nav>
        <address class="contact-details">
            <a href="tel:+17347178198">734.717.8198</a>
            <a href="mailto:jonejd4ve@gmail.com">jonejd4ve@gmail.com</a>
        </address>
    </aside>

    <main class="page-content">
        <p class="placeholder-copy">This website is currently under construction. Check back soon.</p>
    </main>

    <script>
        const menuButton = document.querySelector('.menu-toggle');
        const menuPanel = document.querySelector('.menu-panel');

        function setMenu(open) {
            document.body.classList.toggle('menu-is-open', open);
            menuButton.setAttribute('aria-expanded', String(open));
            menuButton.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
            menuPanel.setAttribute('aria-hidden', String(!open));
        }

        menuButton.addEventListener('click', () => {
            setMenu(menuButton.getAttribute('aria-expanded') !== 'true');
        });

        document.addEventListener('keydown', (event) => {
            if (event.key === 'Escape' && menuButton.getAttribute('aria-expanded') === 'true') {
                setMenu(false);
            }
        });
    </script>
</body>
</html>
